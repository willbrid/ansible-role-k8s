---
- name: Create the kubeconfig directory
  ansible.builtin.file:
    path: "{{ kubernetes_kubeconfig_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# A symbolic link keeps working after `kubeadm certs renew` rewrites admin.conf.
- name: Link the administrator kubeconfig
  ansible.builtin.file:
    src: "{{ _k8s_admin_kubeconfig }}"
    dest: "{{ kubernetes_kubeconfig_dir }}/config"
    state: link
    force: true
