---
# Settings shared by every node of the sandbox cluster.
#
# The CNI choice lives in scenarios/, pass it with -e @scenarios/<file>.yml so
# that the three playbooks always agree on it: kubernetes_cni drives the
# kube-proxy mode, the kernel preparation and the firewall rules of every node,
# not only the CNI deployment done on the primary control plane.

kubernetes_version: "1.34"
kubernetes_patch_version: "1.34.10"

kubernetes_control_plane_ip: "192.168.56.6"
kubernetes_control_plane_endpoint: "192.168.56.6"

kubernetes_pod_network_cidr: "172.16.0.0/16"
kubernetes_service_cidr: "10.96.0.0/12"

# The sandbox VMs are sized right at the preflight thresholds, keep the checks
# on so that an undersized box fails loudly instead of half installing.
kubernetes_preflight_enabled: true
