---
# Full cluster in one run, in the order the role expects: the primary control
# plane first, then the additional control planes, then the workers.
- name: Import the primary control plane play
  ansible.builtin.import_playbook: primary-control-plane.yml

- name: Import the additional control planes play
  ansible.builtin.import_playbook: secondary-control-plane.yml

- name: Import the worker nodes play
  ansible.builtin.import_playbook: worker-node.yml
