---
- name: Include OS family specific variables
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"
  tags:
    - always

- name: Run preflight checks
  ansible.builtin.include_tasks:
    file: preflight/main.yml
    apply:
      tags:
        - preflight
  tags:
    - preflight

- name: Prepare the system
  ansible.builtin.include_tasks: "setup/system-{{ ansible_facts.os_family }}.yml"

- name: Configure package repositories
  ansible.builtin.include_tasks:
    file: "setup/repositories-{{ ansible_facts.os_family }}.yml"
    apply:
      tags:
        - packages
  tags:
    - packages

- name: Prepare the kernel for Kubernetes
  ansible.builtin.include_tasks: setup/kernel.yml

- name: Keep NetworkManager away from the CNI interfaces
  ansible.builtin.include_tasks: setup/networkmanager.yml

- name: Configure the host firewall
  ansible.builtin.include_tasks: setup/firewall.yml
  when: kubernetes_firewall_manage | bool

- name: Install the CRI-O container runtime
  ansible.builtin.include_tasks: "setup/crio-{{ ansible_facts.os_family }}.yml"

- name: Install the Kubernetes packages
  ansible.builtin.include_tasks: "setup/k8s-packages-{{ ansible_facts.os_family }}.yml"

- name: Apply pending system changes before bootstrapping the cluster
  ansible.builtin.meta: flush_handlers

- name: Bootstrap the control plane
  ansible.builtin.include_tasks: cluster/control-plane.yml
  when: kubernetes_role in ['primary_control_plane', 'secondary_control_plane']

- name: Join the worker node
  ansible.builtin.include_tasks: cluster/node.yml
  when: kubernetes_role == 'node'

- name: Record the installed role as a node label
  ansible.builtin.include_tasks: cluster/node-label.yml
  when: kubernetes_node_role_label | length > 0

- name: Deploy the CNI
  ansible.builtin.include_tasks:
    file: cni/main.yml
    apply:
      tags:
        - cni
  when: kubernetes_role == 'primary_control_plane'
  tags:
    - cni
