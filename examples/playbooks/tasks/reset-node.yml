---
- name: Run kubeadm reset
  ansible.builtin.command: kubeadm reset -f --cri-socket unix:///var/run/crio/crio.sock
  register: kubeadm_reset
  changed_when: kubeadm_reset.rc == 0
  failed_when: false

# Calico mounts a cgroup2 filesystem under /var/run/calico/cgroup for its
# connect-time load balancer. Deleting the directory tree on top of a live
# mount point fails with "Operation not permitted", so the mount goes first.
- name: Unmount the Calico cgroup filesystem
  ansible.posix.mount:
    path: /var/run/calico/cgroup
    state: unmounted

- name: Remove the leftover cluster state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cni/net.d
    - /etc/kubernetes
    - /var/lib/etcd
    - /var/lib/cni
    - /root/.kube
    - /var/run/calico
    - /var/run/cilium

- name: Remove the CNI network interfaces
  ansible.builtin.command: "ip link delete {{ item }}"
  loop:
    - vxlan.calico
    - cilium_host
    - cilium_net
    - cilium_vxlan
    - tunl0
  register: link_delete
  changed_when: link_delete.rc == 0
  failed_when: false

# kubeadm reset leaves the kube-proxy tables behind, and Calico leaves its own
# `calico` and `calico-arp` tables. Those outlive the cluster and break the next
# scenario: firewalld, which Cilium needs running, segfaults reading a Calico
# ruleset back through libnftables and never comes up. The role documents the
# same crash for the distribution tooling while Calico is installed.
- name: Flush the nftables ruleset left behind by the CNI and kube-proxy
  ansible.builtin.command: nft flush ruleset
  changed_when: true

- name: Restart CRI-O
  ansible.builtin.systemd_service:
    name: crio
    state: restarted

- name: Stop kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    state: stopped
