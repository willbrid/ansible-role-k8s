---
galaxy_info:
  author: William Bridge
  role_name: k8s
  namespace: willbrid
  description: >-
    Kubeadm based Kubernetes cluster installation for RedHat/Rocky and Debian/Ubuntu,
    with CRI-O runtime and Calico (nftables dataplane) or Cilium (eBPF) CNI.
  license: MIT
  min_ansible_version: "2.18"
  platforms:
    - name: EL
      versions:
        - "9"
        - "10"
    - name: Debian
      versions:
        - "bookworm"
        - "trixie"
    - name: Ubuntu
      versions:
        - "jammy"
        - "noble"
  galaxy_tags:
    - kubernetes
    - k8s
    - kubeadm
    - orchestration
    - container
    - crio
    - calico
    - cilium
    - nftables
    - ebpf

dependencies: []
