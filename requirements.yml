---
# Collections required by the willbrid.k8s role.
# Install them with: ansible-galaxy collection install -r requirements.yml
collections:
  # 2.2.2 is the first release free of the deprecated callback and module_utils
  # APIs that ansible-core 2.23/2.24 will remove: the profile_tasks callback
  # still implemented playbook_on_stats, and the mount module still imported
  # from ansible.module_utils._text and passed warnings to exit_json.
  - name: ansible.posix
    version: ">=2.2.2"
  - name: community.general
    version: ">=9.0.0"
  - name: kubernetes.core
    version: ">=5.0.0"
