[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
display_skipped_hosts = False

# roles_path is deliberately left at its default, so that the role resolves the
# same way it does in a real deployment: from ~/.ansible/roles, where
# `ansible-galaxy install -r requirements.yml` puts it. To run the sandbox
# against a local checkout instead, see the README.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
